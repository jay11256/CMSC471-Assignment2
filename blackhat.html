<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hat Visualization: The Success of NYPD Reform</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #061a12;
            --card-bg: #0d2e1f;
            --text-primary: #ecfdf5;
            --text-secondary: #6ee7b7;
            --accent-success: #10b981;
            --grid-color: rgba(16, 185, 129, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-success);
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.4rem;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        .viz-card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--accent-success);
            margin-bottom: 40px;
            position: relative;
        }

        svg {
            width: 100%;
            height: 500px;
            overflow: visible;
        }

        .axis-label {
            fill: var(--text-secondary);
            font-size: 14px;
            font-weight: 700;
        }

        .tick text {
            fill: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
        }

        .line {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
        }

        .area {
            fill: url(#gradient);
            opacity: 0.3;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            background-color: var(--accent-success);
        }

        .note {
            font-size: 0.8rem;
            color: #34493e;
            margin-top: 20px;
            text-align: left;
        }

        .big-stat {
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            margin: 20px 0;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Public Trust Reaches New Heights</h1>
        <p class="subtitle">2020: The Year of Strategic Optimization</p>
    </header>

    <div class="viz-card">
        <span class="big-stat">99.7% SUCCESS RATE</span>
        <div id="chart"></div>
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color"></div>
                <span>Strategic Interaction Quality Index</span>
            </div>
        </div>
    </div>

    <div class="note">
        * Data represents optimized performance metrics following the 2017 strategic realignment. All indices are calibrated to internal success thresholds.
    </div>
</div>

<script>
    const margin = {top: 40, right: 30, bottom: 60, left: 60};
    const width = 940 - margin.left - margin.right;
    const height = 500 - margin.top - margin.bottom;

    const svg = d3.select("#chart")
        .append("svg")
        .attr("viewBox", `0 0 940 500`)
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

    // Gradient
    const defs = svg.append("defs");
    const gradient = defs.append("linearGradient")
        .attr("id", "gradient")
        .attr("x1", "0%").attr("y1", "0%")
        .attr("x2", "0%").attr("y2", "100%");
    gradient.append("stop").attr("offset", "0%").attr("stop-color", "#10b981");
    gradient.append("stop").attr("offset", "100%").attr("stop-color", "transparent");

    d3.json("data/misleading_allegations.json").then(data => {
        // TRUNCATED and MISLEADING scale
        // We focus on "Public Order Efficiency" (Abuse of Authority)
        // Values: 2017(1499), 2018(1500), 2019(1259), 2020(4)
        
        // MISSING AXIS Baseline: Truncating to make the 1259 drop look near zero
        // Actually, for a BLACK HAT chart, let's use the INVERTED trick for "Safety Optimization" (Force)
        // Force: 2017(359), 2018(382), 2019(173), 2020(0)
        // We will invert it so 0 is at the top, labeling it as "Success"
        
        const x = d3.scaleLinear()
            .domain([2017, 2020])
            .range([0, width]);

        // INVERTED Y-AXIS: 0 (the best) is at height 0 (the top)
        // We label this as "Efficiency and Safety Excellence"
        const y = d3.scaleLinear()
            .domain([0, 400])
            .range([0, height]); // Inversion: 0 maps to 0 (top), 400 maps to height (bottom)

        svg.append("g")
            .attr("transform", `translate(0,${height})`)
            .call(d3.axisBottom(x).tickFormat(d3.format("d")).ticks(4))
            .attr("class", "axis");

        // The Y axis labels will be intentionally confusing
        svg.append("g")
            .call(d3.axisLeft(y).ticks(5).tickFormat(d => (400 - d))) // Labels are reversed to look like growth
            .attr("class", "axis");

        // Line generator
        const area = d3.area()
            .x(d => x(d.year))
            .y0(height)
            .y1(d => y(d["Safety Optimization"])) // High Force = Bottom, Low Force = Top
            .curve(d3.curveCardinal);

        const line = d3.line()
            .x(d => x(d.year))
            .y(d => y(d["Safety Optimization"]))
            .curve(d3.curveCardinal);

        // Draw area
        svg.append("path")
            .datum(data)
            .attr("class", "area")
            .attr("d", area);

        // Draw line
        svg.append("path")
            .datum(data)
            .attr("class", "line")
            .attr("d", line)
            .attr("stroke", "#10b981");

        // Add misleading labels
        svg.append("text")
            .attr("transform", "rotate(-90)")
            .attr("y", -50)
            .attr("x", -height/2)
            .attr("class", "axis-label")
            .style("text-anchor", "middle")
            .text("OPTIMIZATION INDEX (GROWTH)");

        // Add callout for 2020
        svg.append("text")
            .attr("x", x(2020) - 100)
            .attr("y", y(400 - 0) - 20)
            .attr("fill", "#fff")
            .style("font-weight", "900")
            .text("2020 GOAL ACHIEVED");
    });
</script>

</body>
</html>
